# Tidebot runs inside this repository as github-actions[bot].
name: Tidebot

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: write
  deployments: read

concurrency:
  group: tidebot-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  tidebot:
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: fridthjof-labs/tidebot/.github/workflows/run.yml@62727c46d62dae952a241e091b3eeeb213f40ca1 # v0.2.1
    with:
      ref: f790f18e306f6a1a23a28a7c18a5af10369df092 # v0.1.4

name: Release

# Tidebot merges as github-actions[bot], and GitHub does not let a
# GITHUB_TOKEN-authenticated push trigger another workflow's `push` event. A
# Tidebot-merged release PR therefore leaves the tag uncut until the next human
# push to main. Running again after Tidebot finishes on main closes that gap;
# release-please is idempotent, and release-assets stays gated on
# release-created, so a run with nothing to release builds nothing.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Tidebot]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      revision: ${{ steps.release.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-assets:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ needs.release-please.outputs.tag-name }}
      revision: ${{ needs.release-please.outputs.revision }}

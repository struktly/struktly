name: Release

# release-please keeps a release pull request up to date with every change
# merged to main. Merging that pull request is the release: it tags the commit
# and publishes the GitHub release.
#
# There is nothing to build and attach. Struktly is installed with
# `go install github.com/struktly/struktly/cmd/struktly@vX.Y.Z`, so the tag is
# the artifact — the module proxy serves it, and `struktly version` reports it
# from the build info Go records at install time.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

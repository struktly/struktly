name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [1.25.x, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: lint
        run: make lint
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...
      # Struktly's own .struktly/ declarations are the CLI's largest real
      # corpus. Running the CLI against them is what catches a contract that
      # this repository itself no longer satisfies.
      - name: validate this repository
        run: go run ./cmd/struktly validate
      - name: doctor this repository
        run: go run ./cmd/struktly doctor
      - name: vulnerability check
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
